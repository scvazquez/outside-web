<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outside</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--muted:#555;--line:#ddd;--link:#0b57d0}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--muted:#aaa;--line:#333;--link:#8ab4f8}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 16px}
h1{font-size:1.8rem;margin:0 0 .5em}
h2{font-size:1.2rem;margin:1.8em 0 .5em}
a{color:var(--link)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
p,li{color:var(--fg)}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Outside</h1>
<p>Outside helps friends find time to go out together. It is invite-only and in testing.</p>
<p><a href="privacy.html">Privacy notice</a></p>
</main>
</body>
</html>
